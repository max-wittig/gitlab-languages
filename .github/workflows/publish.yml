name: Publish

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
    - name: Publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PASS }}
      run: |
        uv sync --locked --no-dev
        uv run --no-sync gitlab-languages --help
        uv build
        uv publish
